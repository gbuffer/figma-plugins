<!--
  HTMLizer. Converts pasted HTML into Figma auto layout frames and text nodes.

  ============================================================================
  THE ONE RULE: adapt this converter to the HTML, never the HTML to this
  converter.

  The HTML arriving here is whatever any Claude, teammate or web page produced.
  It knows nothing about this file and should not have to. So if a document
  renders wrong, the bug is HERE, in this file or in code.js.

  Do NOT "fix" it by rewriting the source HTML to suit the converter. That was
  tried during the build and explicitly rejected, because the next document
  hits the same limitation and whoever wrote it has no way to know the rules.
  Any CSS this converter mishandles is a converter bug, not a document bug.

  Full spec, design decisions and known limits: see README.md in this folder.
  Read it before changing anything. Several decisions here were reached by
  trying the obvious thing first and finding out why it does not work.

  Neither you nor the person you are helping can run Figma from a chat. You
  cannot verify a change yourself. Hand over the edited file, ask for the
  plugin's log line and a screenshot, and do not claim a fix works until you
  have seen them.

  If this edit changes what the converter actually does, bump the version
  number below and in manifest.json's name field ("HTMLizer vN"), and add one
  line to README.md's Version section. Figma rejects any manifest field it
  does not recognise, so the number lives in the name string, not a field of
  its own. Skip the bump for a comment-only or wording change.
  ============================================================================
-->
<style>
  body { margin: 0; padding: 12px; font: 12px/1.45 "Inter", -apple-system, sans-serif; color: #222; }
  h2 { font-size: 12px; margin: 0 0 8px; font-weight: 600; }
  .version { font-size: 10.5px; color: #9a9f95; margin: -6px 0 10px; }
  textarea { width: 100%; height: 270px; box-sizing: border-box; font: 11px/1.4 ui-monospace, Menlo, monospace; border: 1px solid #d6d8d0; border-radius: 4px; padding: 8px; resize: vertical; }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button { font: 500 12px/1 "Inter", sans-serif; padding: 9px 14px; border: 0; border-radius: 5px; background: #1F3D2B; color: #fff; cursor: pointer; }
  button.ghost { background: #eceee8; color: #333; }
  .vw { margin-left: auto; color: #6b6f66; font-size: 11px; }
  .vw input { width: 58px; font: 11px "Inter", sans-serif; padding: 4px; border: 1px solid #d6d8d0; border-radius: 4px; }
  #log { margin-top: 10px; font-size: 11px; color: #6b6f66; white-space: pre-wrap; max-height: 150px; overflow: auto; }
  #log .warn { color: #9a5b12; }
  #sandbox { position: fixed; left: -99999px; top: 0; }
</style>

<h2>Paste the HTML, including its style block</h2>
<div class="version">v6 — see README.md for what changed at each version</div>
<textarea id="src" placeholder="&lt;div class=&quot;card&quot;&gt; ... &lt;/div&gt;"></textarea>
<div class="bar">
  <button id="go">Convert to Figma</button>
  <button class="ghost" id="clear">Clear</button>
  <label class="vw" title="The browser width the HTML is laid out at, which decides which of its media queries apply">Render width <input id="vw" type="number" value="1280" min="320" max="3840" step="10"> px</label>
</div>
<div id="log"></div>
<div id="sandbox"></div>

<!--
  The converter itself. Never run in this window: its source is appended to the pasted
  page inside the render iframe and runs there. See mount() in the script below for why.
-->
<script type="text/x-htmlizer-walker" id="walker">
const warnings = [];
function warn(m) { if (warnings.indexOf(m) === -1) warnings.push(m); }
function px(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

// Every element lives inside the render iframe's own document (see mount), so its styles
// are read through that document's window, not this one.
function css(el) { return el.ownerDocument.defaultView.getComputedStyle(el); }
function noMargin() { return { t: 0, r: 0, b: 0, l: 0, autoT: false, autoB: false, autoL: false, autoR: false }; }

function colour(v) {
  if (!v || v === 'none' || v === 'transparent') return null;
  const m = v.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(',').map(function (s) { return parseFloat(s.trim()); });
  const a = p.length > 3 ? p[3] : 1;
  if (a === 0) return null;
  return { r: p[0] / 255, g: p[1] / 255, b: p[2] / 255, a: a };
}

function fontStyle(weight, italic) {
  const w = parseInt(weight, 10) || 400;
  const map = [[100,'Thin'],[200,'Extra Light'],[300,'Light'],[400,'Regular'],[500,'Medium'],[600,'Semi Bold'],[700,'Bold'],[800,'Extra Bold'],[900,'Black']];
  let best = map[3], d = Infinity;
  for (const m of map) { const dd = Math.abs(m[0] - w); if (dd < d) { d = dd; best = m; } }
  return (italic && italic !== 'normal') ? best[1] + ' Italic' : best[1];
}

// Authored margins, so that "auto" survives instead of arriving as a resolved pixel value.
function margins(el) {
  const cs = css(el);
  const out = { t: px(cs.marginTop), r: px(cs.marginRight), b: px(cs.marginBottom), l: px(cs.marginLeft), autoT: false, autoB: false, autoL: false, autoR: false };
  try {
    const map = el.computedStyleMap();
    const named = { t: 'margin-top', r: 'margin-right', b: 'margin-bottom', l: 'margin-left' };
    for (const k in named) {
      const v = map.get(named[k]);
      if (v && String(v) === 'auto') {
        out['auto' + k.toUpperCase()] = true;
        out[k] = 0;
      }
    }
  } catch (e) {
    // Typed OM unavailable. An auto margin will read as a large pixel value, so cap it.
    ['t', 'b'].forEach(function (k) { if (out[k] > 60) { out['auto' + k.toUpperCase()] = true; out[k] = 0; } });
  }
  return out;
}

// Authored length, so a plain "width: 150px" is honoured even though it lives on a flex
// item where flex-basis, not width, is the property people expect to matter. Mirrors the
// margins() trick: computedStyleMap keeps the specified value rather than resolving it.
function explicitLength(el, prop) {
  try {
    const v = el.computedStyleMap().get(prop);
    if (v && typeof v.value === 'number' && v.unit === 'px') return v.value;
  } catch (e) {}
  return null;
}

// True for any authored height that is not the default "auto", px or percentage alike.
// A percentage height, such as height:100% used to draw a vertical line, cannot become
// a Figma FILL if its own parent is going to hug, so this flags the case where the
// author's intent has to be approximated from the measured rect instead.
function hasNonAutoHeight(el) {
  try {
    const v = el.computedStyleMap().get('height');
    return !!v && String(v) !== 'auto';
  } catch (e) {
    return false;
  }
}

// A short, legible slug from free text: lowercase, hyphenated, no run-on punctuation.
// Returns null rather than an empty string, so callers can tell "no usable text" apart
// from "a slug that happens to be short".
function slugify(s, maxLen) {
  const slug = s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return slug ? slug.slice(0, maxLen || 40) : null;
}

// A layer's Figma name, tried in order of how likely each source is to already be a real
// label rather than an accident of markup:
//   1. data-name, the html-diagram-for-figma skill's own attribute. Nothing else in
//      ordinary HTML ever writes this, so its presence is a clean signal someone meant
//      it as a name.
//   2. id, the one attribute most HTML authors reach for to label an element even with
//      no idea this converter exists. Can be framework noise (a hash, a generated
//      counter), but noise here still beats no name at all.
//   3. class, the original fallback, shared across elements so less specific than id.
//   4. a slug built from the element's own text content, for a frame with real words
//      inside it but no name of any kind. Not attempting anything smarter than "read
//      what's already there": no picking the most distinctive word, no reordering.
//   5. the tag plus its position among its siblings, reserved for a structural div with
//      nothing else to go on. Not a name, but "div-3" beats an unlabelled "div" among six
//      identical ones: it at least tells two apart, and is a place to start renaming from.
function nodeName(el, fallback) {
  const dn = el.getAttribute && el.getAttribute('data-name');
  if (dn && dn.trim()) return dn.trim().slice(0, 60);

  const id = el.id && el.id.trim();
  if (id) return id.slice(0, 60);

  // getAttribute rather than className, which on an SVG element is an object and came
  // out as the layer name "[object".
  const cls = (el.getAttribute('class') || '').trim().split(/\s+/)[0];
  if (cls) return cls;

  // A full document's body is the outer frame; the page's own title names it better than
  // a slug of everything on the page.
  if (el.tagName.toLowerCase() === 'body') return (el.ownerDocument.title || '').trim().slice(0, 60) || 'body';

  // A table row's textContent runs its cells together with no space between them
  // ("Script + planWording..."), so the row is named after its first cell instead.
  const named = el.tagName.toLowerCase() === 'tr' && el.firstElementChild ? el.firstElementChild : el;
  const txt = (named.textContent || '').trim().replace(/\s+/g, ' ');
  const slug = txt ? slugify(txt, 40) : null;
  if (slug) return slug;

  const parent = el.parentElement;
  if (parent) {
    const idx = Array.prototype.indexOf.call(parent.children, el) + 1;
    if (idx > 0) return fallback + '-' + idx;
  }
  return fallback;
}

function readBorders(cs) {
  const sides = { top: 'Top', right: 'Right', bottom: 'Bottom', left: 'Left' };
  const widths = {}; const present = [];
  for (const k in sides) {
    const w = px(cs['border' + sides[k] + 'Width']);
    widths[k] = w;
    if (w > 0) present.push({ w: w, c: colour(cs['border' + sides[k] + 'Color']) });
  }
  if (!present.length) return null;
  const keys = present.map(function (p) { return p.c ? [p.c.r, p.c.g, p.c.b].join() : 'x'; });
  const uniq = keys.filter(function (k, i) { return keys.indexOf(k) === i; });
  if (uniq.length > 1) warn('An element has different border colours per side. Figma strokes take one colour, so the widest side won.');
  present.sort(function (a, b) { return b.w - a.w; });
  return { widths: widths, colour: present[0].c };
}

function decoration(cs) {
  const b = readBorders(cs);
  return {
    fill: colour(cs.backgroundColor),
    borders: b,
    radius: px(cs.borderTopLeftRadius),
    transparent: !colour(cs.backgroundColor) && !b && !px(cs.borderTopLeftRadius)
  };
}

function align(v) {
  if (v === 'center') return 'CENTER';
  if (v === 'flex-end' || v === 'end' || v === 'right') return 'MAX';
  if (v === 'space-between') return 'SPACE_BETWEEN';
  return 'MIN';
}

function sizing(cs, parentLayout, isRoot, el) {
  const grow = parseFloat(cs.flexGrow) || 0;
  const basis = (cs.flexBasis && cs.flexBasis.indexOf('px') > -1) ? px(cs.flexBasis) : null;
  const explicitW = explicitLength(el, 'width');
  const explicitH = explicitLength(el, 'height');
  const out = { h: 'HUG', v: 'HUG', minWidth: null, fixedWidth: null, maxWidth: null, fixedHeight: null, grow: grow };
  if (cs.maxWidth && cs.maxWidth.indexOf('px') > -1) out.maxWidth = px(cs.maxWidth);
  if (cs.minWidth && cs.minWidth.indexOf('px') > -1) out.minWidth = px(cs.minWidth);
  if (isRoot) { out.h = 'FIXED'; return out; }
  // A table cell's width is set by its whole column, not by its own content, so the one
  // number that lines the columns up across every row is the width the browser measured.
  if (cs.display === 'table-cell') {
    out.h = 'FIXED'; out.fixedWidth = Math.max(1, Math.round(el.getBoundingClientRect().width));
    return out;
  }
  if (parentLayout === 'HORIZONTAL') {
    if (grow > 0) { out.h = 'FILL'; if (basis && !out.minWidth) out.minWidth = basis; }
    else if (basis) { out.h = 'FIXED'; out.fixedWidth = basis; }
    else if (explicitW != null) { out.h = 'FIXED'; out.fixedWidth = explicitW; }
    // Height stays HUG, same as a vertical row's children. FILL was tried here as the
    // equal-height-cards pattern; direct testing in Figma showed it does not reliably
    // resolve once two siblings have genuinely different content lengths, so a correct,
    // individually-hugged card beats a shared height that only sometimes arrives. See
    // "Equal height cards, retracted" in the README.
  } else if (explicitW != null) {
    out.h = 'FIXED'; out.fixedWidth = explicitW;
  } else if (/^inline-(block|flex|grid|table)$/.test(cs.display)) {
    // An inline-block is as wide as its content, a pill or badge, not as wide as the line
    // it sits on. FILL stretched every CP1 and "to run" pill across the whole page.
    out.h = 'HUG';
  } else {
    out.h = 'FILL';
  }
  // A definite height beats the generic default in either direction. This is what stops
  // an element with height:28px from being left to hug when its parent is vertical, and
  // is the other half of what makes the percentage height case safe: see hasNonAutoHeight
  // at the one call site that also measures the rendered rect.
  if (explicitH != null) { out.v = 'FIXED'; out.fixedHeight = explicitH; }
  return out;
}

// text-transform changes what is drawn, not textContent, so it has to be carried over as
// Figma's own text case or an uppercase table header arrives in lowercase.
const TEXT_CASE = { uppercase: 'UPPER', lowercase: 'LOWER', capitalize: 'TITLE' };

// The parts of a text style that can differ within one Figma text node, range by range.
function runStyle(cs) {
  return {
    fontFamily: (cs.fontFamily || 'Inter').split(',')[0].replace(/["']/g, '').trim(),
    fontStyle: fontStyle(cs.fontWeight, cs.fontStyle),
    fontSize: px(cs.fontSize),
    colour: colour(cs.color) || { r: 0, g: 0, b: 0, a: 1 },
    textCase: TEXT_CASE[cs.textTransform] || null
  };
}

function styleKey(s) {
  return [s.fontFamily, s.fontStyle, s.fontSize, s.colour.r, s.colour.g, s.colour.b, s.colour.a, s.textCase].join('|');
}

function textSpec(cs, characters) {
  return Object.assign(runStyle(cs), {
    kind: 'TEXT',
    name: (characters || '').slice(0, 34).replace(/\s+/g, ' ') || 'text',
    characters: characters,
    lineHeight: cs.lineHeight === 'normal' ? null : { value: px(cs.lineHeight), unit: 'PIXELS' },
    letterSpacing: px(cs.letterSpacing),
    hAlign: cs.textAlign === 'center' ? 'CENTER' : (cs.textAlign === 'right' ? 'RIGHT' : 'LEFT'),
    runs: [],
    list: false, ordered: false, paragraphSpacing: 0, listSpacing: 0,
    sizeH: 'FILL', sizeV: 'HUG', minWidth: null, fixedWidth: null, maxWidth: null
  });
}

// pre, pre-wrap and break-spaces keep every space and newline as written. Collapsing them
// the normal way turned a code block into one run-on paragraph.
function keepsWhitespace(cs) {
  const c = cs.whiteSpaceCollapse || '';
  return c === 'preserve' || c === 'break-spaces' || /^(pre|pre-wrap|break-spaces)$/.test(cs.whiteSpace);
}

function textOf(el, cs) {
  const raw = el.textContent || '';
  if (keepsWhitespace(cs)) return raw.replace(/^\r?\n/, '').replace(/\s+$/, '');
  if (cs.whiteSpace === 'pre-line' || cs.whiteSpaceCollapse === 'preserve-breaks') {
    return raw.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').trim();
  }
  return raw.trim().replace(/\s+/g, ' ');
}

// Reads a paragraph that mixes plain text with inline tags, <b>, <em>, <code>, <a>, into
// one string plus the style of every stretch of it, so it becomes one Figma text node with
// styled ranges. Reading textContent alone kept the words and lost the bold; walking the
// tags as children kept the bold and dropped the loose text between them.
function richText(root) {
  const keep = keepsWhitespace(css(root));
  let text = '';
  const runs = [];
  (function visit(n) {
    if (n.nodeType === 3) {
      let s = n.textContent;
      if (!keep) {
        s = s.replace(/\s+/g, ' ');
        if (s.charAt(0) === ' ' && (!text || /\s$/.test(text))) s = s.slice(1);
      }
      if (!s) return;
      runs.push(Object.assign(runStyle(css(n.parentElement)), { start: text.length, end: text.length + s.length }));
      text += s;
    } else if (n.nodeType === 1 && !isNonVisual(n) && css(n).display !== 'none') {
      if (n.tagName.toLowerCase() === 'br') { text += '\n'; return; }
      Array.prototype.forEach.call(n.childNodes, visit);
    }
  })(root);
  text = text.replace(/\s+$/, '');
  runs.forEach(function (r) { r.end = Math.min(r.end, text.length); });
  return { text: text, runs: runs.filter(function (r) { return r.end > r.start; }) };
}

// Keeps only the ranges that differ from the text node's own base style, merged where
// neighbours match, so a plain paragraph carries no ranges at all.
function withRuns(spec, runs) {
  const base = styleKey(spec);
  spec.runs = [];
  runs.forEach(function (r) {
    if (styleKey(r) === base) return;
    const last = spec.runs[spec.runs.length - 1];
    if (last && last.end === r.start && styleKey(last) === styleKey(r)) last.end = r.end;
    else spec.runs.push(r);
  });
  return spec;
}

// Inline elements that draw a box of their own rather than only formatting text.
const ATOMIC = ['svg', 'img', 'video', 'canvas', 'iframe', 'input', 'button', 'select', 'textarea'];

function isInlineLevel(el) {
  return el.tagName.toLowerCase() === 'br' || css(el).display.indexOf('inline') === 0;
}

// Plain display:inline text formatting, which can fold into a styled range. An inline
// background, such as a code span's tint, has nowhere to go on a range and is dropped;
// that beats splitting a paragraph into a row of pieces that can no longer wrap.
function isPlainInline(el) {
  const tag = el.tagName.toLowerCase();
  if (tag === 'br') return true;
  if (ATOMIC.indexOf(tag) > -1 || css(el).display !== 'inline') return false;
  return Array.prototype.every.call(el.children, function (c) { return isNonVisual(c) || isPlainInline(c); });
}

// An <svg> is handed to Figma's own importer rather than read through the CSS box model
// the rest of this converter uses, since SVG styles itself through geometry and
// presentation attributes, fill, d, cx, points, that getComputedStyle never reports.
// Reading it the normal way would find no background, no border, nothing sized, and
// silently drop every shape inside it as noise, the same as an empty, undecorated div.
// Fixed at its own measured size, not folded into the FILL/HUG/FIXED chain the rest of
// this file uses: scaling vector content correctly, so a resized frame scales the paths
// inside it rather than just cropping or padding them, is a separate problem this does
// not yet attempt.
//
// The markup is not passed through untouched, though. An SVG styled from the page's
// stylesheet, `.n.claude rect { fill: var(--claude) }`, carries none of that in its own
// markup, and the importer filled every such shape with its default, black. So each
// element's final computed paint, stroke and font is written onto it as presentation
// attributes first, variables already resolved, and the importer sees what the browser drew.
function svgNode(el) {
  const r = el.getBoundingClientRect();
  const copy = el.cloneNode(true);
  const src = [el].concat(Array.prototype.slice.call(el.querySelectorAll('*')));
  const dst = [copy].concat(Array.prototype.slice.call(copy.querySelectorAll('*')));
  const hidden = [];
  src.forEach(function (s, i) { if (!inlineSvgStyle(s, dst[i])) hidden.push(dst[i]); });
  hidden.forEach(function (d) { if (d.parentNode) d.parentNode.removeChild(d); });
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (!copy.hasAttribute('xmlns')) copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  copy.setAttribute('width', w);
  copy.setAttribute('height', h);
  return {
    kind: 'SVG',
    name: nodeName(el, 'svg'),
    markup: copy.outerHTML,
    sizeH: 'FIXED', fixedWidth: w,
    sizeV: 'FIXED', fixedHeight: h,
    minWidth: null, maxWidth: null
  };
}

// A computed paint as SVG presentation attributes understand it: rgb plus a separate
// opacity, url(#id) without the quotes getComputedStyle adds, and transparent as none.
function svgPaint(v) {
  const url = (v || '').match(/url\(["']?([^"')]+)["']?\)/);
  if (url) return { paint: 'url(' + url[1] + ')', alpha: 1 };
  const c = colour(v);
  if (!c) return { paint: 'none', alpha: 1 };
  return { paint: 'rgb(' + [c.r, c.g, c.b].map(function (n) { return Math.round(n * 255); }).join(',') + ')', alpha: c.a };
}

// Returns false for an element the page hides, so the caller can remove it.
function inlineSvgStyle(src, dst) {
  const cs = css(src);
  if (cs.display === 'none') return false;
  dst.removeAttribute('style');
  dst.removeAttribute('class');
  ['fill', 'stroke'].forEach(function (p) {
    const v = svgPaint(cs.getPropertyValue(p));
    let o = parseFloat(cs.getPropertyValue(p + '-opacity'));
    if (isNaN(o)) o = 1;
    dst.setAttribute(p, v.paint);
    dst.setAttribute(p + '-opacity', String(+(o * v.alpha).toFixed(3)));
  });
  ['stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity'].forEach(function (p) {
    const v = cs.getPropertyValue(p);
    if (v) dst.setAttribute(p, v.replace(/px/g, ''));
  });
  if (/^(text|tspan|textpath)$/.test(src.tagName.toLowerCase())) {
    ['font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor'].forEach(function (p) {
      const v = cs.getPropertyValue(p);
      if (v) dst.setAttribute(p, v.replace(/px$/, ''));
    });
    if (cs.letterSpacing && cs.letterSpacing !== 'normal') dst.setAttribute('letter-spacing', px(cs.letterSpacing));
  }
  return true;
}

function frameSpec(name, layout) {
  return {
    kind: 'FRAME', name: name, layout: layout, gap: 0,
    align: 'MIN', crossAlign: 'MIN',
    padding: { t: 0, r: 0, b: 0, l: 0 },
    radius: 0, fill: null, borders: null, clip: false,
    sizeH: 'FILL', sizeV: 'HUG', minWidth: null, fixedWidth: null, maxWidth: null, fixedHeight: null,
    children: []
  };
}

// A text node cannot hold padding, fill or strokes, so give it a frame when the CSS asks for any.
function boxIfNeeded(node, cs, sizes) {
  const dec = decoration(cs);
  const pad = { t: px(cs.paddingTop), r: px(cs.paddingRight), b: px(cs.paddingBottom), l: px(cs.paddingLeft) };
  const needsPad = pad.t || pad.r || pad.b || pad.l;
  if (dec.transparent && !needsPad) {
    node.sizeH = sizes.h; node.sizeV = 'HUG';
    node.minWidth = sizes.minWidth; node.fixedWidth = sizes.fixedWidth; node.maxWidth = sizes.maxWidth;
    node.grow = sizes.grow;
    return node;
  }
  // A hugging box needs hugging text: FILL text inside a HUG box is the parent-child
  // deadlock described in the README, with neither side holding a real number.
  node.sizeH = sizes.h === 'HUG' ? 'HUG' : 'FILL'; node.sizeV = 'HUG';
  const box = frameSpec(node.name.slice(0, 22) + ' box', 'VERTICAL');
  box.padding = pad;
  box.radius = dec.radius; box.fill = dec.fill; box.borders = dec.borders;
  box.clip = cs.overflow === 'hidden';
  box.sizeH = sizes.h; box.minWidth = sizes.minWidth; box.fixedWidth = sizes.fixedWidth; box.maxWidth = sizes.maxWidth;
  box.grow = sizes.grow;
  if (sizes.fixedHeight != null) { box.sizeV = 'FIXED'; box.fixedHeight = sizes.fixedHeight; }
  box.children = [node];
  return box;
}

function mode(nums) {
  const tally = {}; let best = 0, bestN = 0;
  nums.forEach(function (n) {
    if (n > 0) { tally[n] = (tally[n] || 0) + 1; if (tally[n] > bestN) { bestN = tally[n]; best = n; } }
  });
  return best;
}

function listNode(el, cs, sizes) {
  const items = Array.prototype.slice.call(el.children).filter(function (c) { return c.tagName.toLowerCase() === 'li'; });
  if (!items.length) return null;
  const liCs = css(items[0]);
  const lines = items.map(richText);
  const cols = parseInt(cs.columnCount, 10) || 1;

  // Each item's styled ranges are shifted by where that item starts in the joined text.
  function make(subset) {
    let chars = '';
    const runs = [];
    subset.forEach(function (line, i) {
      if (i) chars += '\n';
      const at = chars.length;
      line.runs.forEach(function (r) { runs.push(Object.assign({}, r, { start: r.start + at, end: r.end + at })); });
      chars += line.text;
    });
    const t = withRuns(textSpec(liCs, chars), runs);
    t.list = true;
    t.ordered = el.tagName.toLowerCase() === 'ol';
    t.paragraphSpacing = px(liCs.marginBottom);
    t.listSpacing = px(liCs.marginBottom);
    t.name = (t.ordered ? 'list ' : 'bullets ') + subset.length;
    return t;
  }

  // CSS columns become side by side text nodes rather than one flattened column.
  if (cols > 1 && lines.length > 1) {
    const per = Math.ceil(lines.length / cols);
    const row = frameSpec('list columns', 'HORIZONTAL');
    row.gap = px(cs.columnGap) || 24;
    for (let i = 0; i < lines.length; i += per) {
      const t = make(lines.slice(i, i + per));
      t.sizeH = 'FILL';
      row.children.push(t);
    }
    row.sizeH = sizes.h; row.minWidth = sizes.minWidth; row.maxWidth = sizes.maxWidth; row.grow = sizes.grow;
    const pad = { t: px(cs.paddingTop), r: px(cs.paddingRight), b: px(cs.paddingBottom), l: px(cs.paddingLeft) };
    row.padding = pad;
    return row;
  }
  return boxIfNeeded(make(lines), cs, sizes);
}

// CSS grid has no Figma equivalent, but its result does: rows of items side by side. Items
// are grouped by where the browser actually put them, their rendered top edge, so spans,
// auto placement and responsive templates come out however they rendered, without this
// file having to understand grid-template syntax. Each item sharing a row is pinned at its
// measured width, the same real-number rule as everywhere else here; an item alone on its
// row, such as a header spanning every column, keeps filling the full width.
function gridRows(built, cs) {
  const rows = [];
  built.forEach(function (b) {
    const r = b.el.getBoundingClientRect();
    let row = rows.find(function (x) { return Math.abs(x.top - r.top) <= 2; });
    if (!row) { row = { top: r.top, items: [] }; rows.push(row); }
    row.items.push({ b: b, r: r });
  });
  if (rows.every(function (x) { return x.items.length === 1; })) return built;

  rows.sort(function (a, b) { return a.top - b.top; });
  const stretch = cs.alignItems === 'normal' || cs.alignItems === 'stretch';
  return rows.map(function (row, i) {
    if (row.items.length === 1) return row.items[0].b;
    row.items.sort(function (a, b) { return a.r.left - b.r.left; });
    const spec = frameSpec('row-' + (i + 1), 'HORIZONTAL');
    spec.gap = px(cs.columnGap);
    let bottom = row.top;
    row.items.forEach(function (it) {
      it.b.spec.sizeH = 'FIXED';
      it.b.spec.fixedWidth = Math.max(1, Math.round(it.r.width));
      it.b.spec.minWidth = null; it.b.spec.maxWidth = null;
      bottom = Math.max(bottom, it.r.bottom);
      spec.children.push(it.b.spec);
    });
    // Grid stretches items to the row's height by default; same measured-anchor pattern
    // as align-items: stretch on a flex row.
    if (stretch) {
      spec.sizeV = 'FIXED';
      spec.fixedHeight = Math.max(1, Math.round(bottom - row.top));
      row.items.forEach(function (it) { if (it.b.spec.kind === 'FRAME' && it.b.spec.sizeV === 'HUG') it.b.spec.sizeV = 'FILL'; });
    }
    return { spec: spec, el: null, m: noMargin(), cs: cs };
  });
}

function walk(el, parentLayout, isRoot) {
  const cs = css(el);
  const tag = el.tagName.toLowerCase();
  if (cs.display === 'none' || isNonVisual(el)) return null;
  if (cs.position === 'absolute' || cs.position === 'fixed') warn('Absolute positioning was ignored.');

  const sizes = sizing(cs, parentLayout, isRoot, el);
  if (tag === 'ul' || tag === 'ol') return listNode(el, cs, sizes);
  if (tag === 'svg') return svgNode(el);

  const kids = Array.prototype.slice.call(el.children).filter(function (c) {
    return !isNonVisual(c) && css(c).display !== 'none';
  });

  if (!kids.length) {
    const txt = textOf(el, cs);
    if (!txt) {
      const dec = decoration(cs);
      const r = el.getBoundingClientRect();
      const explicitW = explicitLength(el, 'width');
      const nonAutoH = hasNonAutoHeight(el);
      const isSmall = r.width <= 8 || r.height <= 8;

      // An empty element with no fill, no border and no size the author actually set is
      // noise, most likely left over from a template. Drop it. Anything that specifies
      // its own size exists on purpose, either as a spacer holding a gap open or as a
      // hand drawn rule line, and both are kept even with no fill.
      if (dec.transparent && explicitW == null && !nonAutoH && !isSmall) return null;

      const node = frameSpec(nodeName(el, dec.transparent ? 'spacer' : 'rule'), 'VERTICAL');
      node.fill = dec.fill; node.borders = dec.borders; node.radius = dec.radius;
      node.minWidth = sizes.minWidth; node.maxWidth = sizes.maxWidth; node.grow = sizes.grow;

      node.sizeH = explicitW != null ? 'FIXED' : (r.width <= 8 ? 'FIXED' : sizes.h);
      node.fixedWidth = explicitW != null ? explicitW : (r.width <= 8 ? Math.max(1, Math.round(r.width)) : sizes.fixedWidth);

      // A transparent leaf with no authored height only ever got a height at all because
      // the browser's default align-items: stretch gave it one for free. That measured
      // number reflects nothing the author asked for, and trusting it as FILL puts an
      // empty node in competition with a real sibling for a height nothing here actually
      // drives. Hug it instead: an empty frame hugs to zero, contributes nothing to the
      // parent's own height, and leaves the sibling with real content to decide it alone,
      // the same way the browser did. This is what a 690px offset column collapsing a
      // whole row into a tall, narrow sliver turned out to be.
      if (dec.transparent && !nonAutoH) {
        node.sizeV = 'HUG';
        node.isSpacer = true;   // flagged so a horizontal row can drop it for native alignment; see below
      } else {
        node.sizeV = (nonAutoH || r.height <= 8) ? 'FIXED' : sizes.v;
        node.fixedHeight = Math.max(1, Math.round(r.height));
      }
      return node;
    }
    return boxIfNeeded(textSpec(cs, txt), cs, sizes);
  }

  const flex = cs.display === 'flex' || cs.display === 'inline-flex';
  const grid = cs.display.indexOf('grid') > -1;

  // Loose text beside child elements used to be dropped with a warning, which lost the
  // legend's labels and the "Script + plan" beside every CP pill. Three shapes now:
  //   - only plain inline formatting around it, <b>, <em>, <a>: one text node with styled
  //     ranges, returned right here;
  //   - inline boxes among it, a pill, an icon: a horizontal row, text and boxes in order;
  //   - a flex or block container: the text becomes a child of its own, in the
  //     container's own direction, which is what the browser does with it anyway.
  const looseText = Array.prototype.some.call(el.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
  let inlineRow = false;
  if (looseText && !flex && !grid && kids.every(isInlineLevel)) {
    if (kids.every(isPlainInline)) {
      const rt = richText(el);
      return boxIfNeeded(withRuns(textSpec(cs, rt.text), rt.runs), cs, sizes);
    }
    inlineRow = true;
  }

  // A table row is a row: its cells sit side by side.
  const layout = (inlineRow || cs.display === 'table-row' || (flex && cs.flexDirection.indexOf('row') === 0)) ? 'HORIZONTAL' : 'VERTICAL';
  const blockFlow = !flex;   // block layout collapses adjacent vertical margins; flex does not

  const dec = decoration(cs);
  const node = frameSpec(nodeName(el, tag), layout);
  node.gap = layout === 'HORIZONTAL' ? px(cs.columnGap || cs.gap) : px(cs.rowGap || cs.gap);
  node.align = align(cs.justifyContent);
  node.crossAlign = align((cs.alignItems === 'stretch' || cs.alignItems === 'normal') ? 'flex-start' : cs.alignItems);
  node.padding = { t: px(cs.paddingTop), r: px(cs.paddingRight), b: px(cs.paddingBottom), l: px(cs.paddingLeft) };
  node.radius = dec.radius; node.fill = dec.fill; node.borders = dec.borders;
  node.clip = cs.overflow === 'hidden';
  node.sizeH = sizes.h; node.sizeV = sizes.v;
  node.minWidth = sizes.minWidth; node.fixedWidth = sizes.fixedWidth; node.maxWidth = sizes.maxWidth;
  node.fixedHeight = sizes.fixedHeight; node.grow = sizes.grow;
  if (inlineRow) {
    // Roughly the width of the space the browser left between a pill and its words.
    node.gap = Math.round(px(cs.fontSize) * 0.25);
    node.crossAlign = 'CENTER';
  }

  const items = looseText
    ? Array.prototype.filter.call(el.childNodes, function (n) {
        return n.nodeType === 3 ? !!n.textContent.trim() : kids.indexOf(n) > -1;
      })
    : kids;

  let built = [];
  for (const k of items) {
    if (k.nodeType === 3) {
      const t = textSpec(cs, keepsWhitespace(cs) ? k.textContent : k.textContent.trim().replace(/\s+/g, ' '));
      // Text in a row wraps into whatever the row leaves it, unless the row itself hugs,
      // where FILL would have nothing to fill.
      t.sizeH = layout === 'VERTICAL' ? 'FILL' : (inlineRow && sizes.h !== 'HUG' ? 'FILL' : 'HUG');
      built.push({ spec: t, el: null, m: noMargin(), cs: cs });
      continue;
    }
    const spec = walk(k, layout, false);
    if (spec) built.push({ spec: spec, el: k, m: margins(k), cs: css(k) });
  }
  if (!built.length) return null;

  if (grid && built.length > 1 && built.every(function (b) { return b.el; })) built = gridRows(built, cs);

  // A spacer sitting at either end of a horizontal row exists only to push the real
  // content to the far side, a job Figma's own alignment already does natively. Keeping
  // the spacer as a node means giving it a width, and a fixed px width in the source CSS
  // is not actually fixed in the browser once its flexible sibling has room to negotiate
  // for: the two shrink and grow against each other, so a literal number copied out of
  // the CSS routinely does not match what the browser actually rendered. Dropping the
  // spacer and aligning the row to the opposite end sidesteps that arithmetic entirely.
  if (layout === 'HORIZONTAL' && !inlineRow) {
    const spacerAt = built.findIndex(function (b) { return b.spec.isSpacer; });
    if ((spacerAt === 0 || spacerAt === built.length - 1) && built.length > 1) {
      const pushToFarEnd = spacerAt === 0;
      built.splice(spacerAt, 1);
      node.align = pushToFarEnd ? 'MAX' : 'MIN';
      // The remaining content no longer has a sibling to negotiate width against, and
      // that removes the one thing FILL was resolving relative to. HUG is not the answer
      // either: if this element's own children are themselves FILL, expecting a real
      // number from here, a HUG parent with FILL children is the identical deadlock one
      // level down, neither side has anything concrete, and both collapse. What the
      // sandbox actually measured is a real number either side can anchor to, so that is
      // what gets used, in place of a relative instruction with nothing left to resolve
      // against.
      built.forEach(function (b) {
        if (b.spec.sizeH === 'FILL' && b.el) {
          const r = b.el.getBoundingClientRect();
          b.spec.sizeH = 'FIXED';
          b.spec.fixedWidth = Math.max(1, Math.round(r.width));
          b.spec.minWidth = null;
        }
      });
    }
  }

  // CSS flex-grow is a ratio between siblings; Figma's Fill sizing is not, it only
  // knows whether a child fills or does not, splitting whatever space is available
  // equally among everyone filling it. That reproduces CSS correctly whenever the
  // growing siblings all share the same grow value, which is the common case (several
  // flex:1 cards in a row) and is left alone. It cannot reproduce an uneven one:
  // pain-point-a-wrapper at flex:3 beside pain-point-b-wrapper at flex:1 came out an
  // exact 50/50 split in Figma rather than 75/25, and the wider content inside the
  // now too narrow side spilled out past its own frame's edge and across the boundary
  // into its neighbour, uncontained, since nothing here clips by default. Whenever a
  // row's filling children do not all share the same grow value, Fill has no way to
  // tell them apart, so each one is measured at its real rendered width in the sandbox
  // and pinned there instead, the same way a fixed spacer's real width was measured
  // rather than trusted to a relative instruction above.
  if (layout === 'HORIZONTAL' && !inlineRow) {
    const growers = built.filter(function (b) { return b.spec.sizeH === 'FILL' && !b.spec.isSpacer && b.el; });
    const distinctGrows = new Set(growers.map(function (b) { return b.spec.grow; }));
    if (growers.length > 1 && distinctGrows.size > 1) {
      growers.forEach(function (b) {
        const r = b.el.getBoundingClientRect();
        b.spec.sizeH = 'FIXED';
        b.spec.fixedWidth = Math.max(1, Math.round(r.width));
        b.spec.minWidth = null;
      });
    }
  }

  // align-items: stretch, the flexbox default when nothing else is set, makes every
  // child in a row match the tallest one, and a shorter child's own background simply
  // extends to fill the gap rather than leaving a visible seam. A HUG child cannot
  // reproduce that on its own, it just sits at its own natural height, and asking it to
  // FILL needs a parent with a real number to fill into, which a HUG row does not have
  // to give: exactly the failure in "Equal height cards, retracted" above, and forcing
  // this carelessly would reproduce it. The safe version measures what the row actually
  // stretched to in the real sandbox, pins the row to that as a FIXED height, and only
  // then lets real content FILL against that concrete anchor. A bare line of text is
  // left alone rather than asked to FILL: Figma resizes a text node's own height
  // automatically, and that was never tested alongside FILL together. It is centred in
  // the row instead, which looks identical for anything with no background of its own
  // to reveal the difference.
  if (layout === 'HORIZONTAL' && !inlineRow && (cs.alignItems === 'stretch' || cs.alignItems === 'normal') && built.length > 1) {
    const rowRect = el.getBoundingClientRect();
    node.sizeV = 'FIXED';
    node.fixedHeight = Math.max(1, Math.round(rowRect.height));
    let bareTextLeftOut = false;
    built.forEach(function (b) {
      if (b.spec.isSpacer) return;
      if (b.spec.kind === 'FRAME') { b.spec.sizeV = 'FILL'; }
      else { bareTextLeftOut = true; }
    });
    // Table cells default to vertical-align: top in practice, so a table row stays top aligned.
    if (bareTextLeftOut && cs.display !== 'table-row') node.crossAlign = 'CENTER';
  }

  // Frames have no margin, so margins are expressed as padding, gap, wrappers or spacers.
  if (layout === 'VERTICAL') {
    // Edge margins are indistinguishable from the parent's padding.
    node.padding.t += built[0].m.t; built[0].m.t = 0;
    const last = built[built.length - 1];
    node.padding.b += last.m.b; last.m.b = 0;

    // A horizontal margin shared by every child is also just the parent's padding.
    const minL = Math.min.apply(null, built.map(function (b) { return b.m.l; }));
    const minR = Math.min.apply(null, built.map(function (b) { return b.m.r; }));
    if (minL > 0) { node.padding.l += minL; built.forEach(function (b) { b.m.l -= minL; }); }
    if (minR > 0) { node.padding.r += minR; built.forEach(function (b) { b.m.r -= minR; }); }

    // margin: 0 auto centres a child. Figma does that with the parent's cross axis
    // alignment, and any max-width already carried over keeps the child from filling.
    if (built.some(function (b) { return b.m.autoL && b.m.autoR; })) node.crossAlign = 'CENTER';

    const spacings = [];
    for (let i = 1; i < built.length; i++) {
      const prev = built[i - 1].m.b, cur = built[i].m.t;
      spacings.push(blockFlow ? Math.max(prev, cur) : prev + cur);
    }
    if (node.gap === 0) node.gap = mode(spacings);

    let autoAt = -1;
    built.forEach(function (b, i) {
      // Anything left over on the sides gets a transparent wrapper, unless the child is
      // undecorated, in which case the margin folds into the child's own padding.
      if (b.m.l > 0 || b.m.r > 0) {
        const childDec = decoration(b.cs);
        if (b.spec.kind === 'FRAME' && childDec.transparent) {
          b.spec.padding.l += b.m.l;
          b.spec.padding.r += b.m.r;
        } else {
          const wrap = frameSpec(b.spec.name + ' inset', 'VERTICAL');
          wrap.padding = { t: 0, r: b.m.r, b: 0, l: b.m.l };
          wrap.sizeH = b.spec.sizeH === 'HUG' ? 'HUG' : 'FILL';
          wrap.sizeV = b.spec.sizeV;
          b.spec.sizeH = 'FILL';
          wrap.children = [b.spec];
          b.spec = wrap;
        }
      }
      if (b.m.autoT && i > 0 && autoAt === -1) autoAt = node.children.length;
      node.children.push(b.spec);
      if (i < built.length - 1) {
        const extra = spacings[i] - node.gap;
        if (extra > 1) {
          const s = frameSpec('spacer ' + Math.round(extra), 'VERTICAL');
          s.kind = 'SPACER'; s.height = Math.round(extra); s.sizeV = 'FIXED';
          node.children.push(s);
        }
      }
    });

    // margin-top: auto means push me to the far end. A frame set to fill height cannot do
    // that inside a parent that hugs its content, because neither one can resolve first.
    // Grouping everything above it gives the frame exactly two children, and space between
    // then pins one to each end with no spacer and no circular height.
    if (autoAt > 0) {
      const gapWas = node.gap;
      const content = frameSpec('content', 'VERTICAL');
      content.gap = gapWas;
      content.padding.b = gapWas;   // holds a minimum gap when the frame is only as tall as its content
      content.children = node.children.slice(0, autoAt);
      const rest = node.children.slice(autoAt);
      let tail = rest[0];
      if (rest.length > 1) {
        tail = frameSpec('tail', 'VERTICAL');
        tail.gap = gapWas;
        tail.children = rest;
      }
      node.children = [content, tail];
      node.align = 'SPACE_BETWEEN';
      node.gap = 0;
    }
  } else {
    const minT = Math.min.apply(null, built.map(function (b) { return b.m.t; }));
    const minB = Math.min.apply(null, built.map(function (b) { return b.m.b; }));
    if (minT > 0) { node.padding.t += minT; built.forEach(function (b) { b.m.t -= minT; }); }
    if (minB > 0) { node.padding.b += minB; built.forEach(function (b) { b.m.b -= minB; }); }
    built.forEach(function (b, i) {
      const extraGap = (i === 0 ? b.m.l : 0);
      if (extraGap) node.padding.l += extraGap;
      if (b.m.t > 0 || b.m.b > 0) {
        const childDec = decoration(b.cs);
        if (b.spec.kind === 'FRAME' && childDec.transparent) {
          b.spec.padding.t += b.m.t; b.spec.padding.b += b.m.b;
        } else {
          const wrap = frameSpec(b.spec.name + ' inset', 'VERTICAL');
          wrap.padding = { t: b.m.t, r: 0, b: b.m.b, l: 0 };
          wrap.sizeH = b.spec.sizeH; wrap.sizeV = b.spec.sizeV;
          b.spec.sizeH = 'FILL';
          wrap.children = [b.spec];
          b.spec = wrap;
        }
      }
      node.children.push(b.spec);
    });
    if (node.gap === 0) {
      const between = [];
      for (let i = 1; i < built.length; i++) between.push(built[i - 1].m.r + built[i].m.l);
      node.gap = mode(between);
    }
  }

  if (isRoot) {
    node.fixedWidth = Math.round(el.getBoundingClientRect().width);
    const rm = margins(el);
    node.padding.l += rm.l; node.padding.r += rm.r;
    node.padding.t += rm.t; node.padding.b += rm.b;
  }
  return node;
}

// Tags that exist in the markup but never render anything.
const NON_VISUAL = ['style', 'script', 'meta', 'title', 'link', 'base', 'head', 'noscript'];

function isNonVisual(el) {
  return NON_VISUAL.indexOf(el.tagName.toLowerCase()) > -1;
}

// Pick something that actually renders. If several things do, keep them together.
function pickRoot(doc) {
  const candidates = Array.prototype.slice.call(doc.body.children).filter(function (c) {
    return !isNonVisual(c) && css(c).display !== 'none';
  });
  if (!candidates.length) return null;
  if (candidates.length === 1) return candidates[0];

  const holder = doc.createElement('div');
  holder.className = 'h2f-multiple';
  holder.style.display = 'flex';
  holder.style.flexDirection = 'column';
  candidates.forEach(function (c) { holder.appendChild(c); });
  doc.body.appendChild(holder);
  return holder;
}

// Runs inside the render iframe once the page has loaded, and posts the tree back out.
function htmlizerRun(isDocument) {
  const msg = { warnings: warnings };
  try {
    (window.__h2fErrors || []).forEach(function (m) { warn('A script in the pasted HTML failed: ' + m); });
    if (isDocument) warn('A full HTML document was pasted. The body element became the outer frame.');
    const root = isDocument ? document.body : pickRoot(document);
    if (!root) {
      msg.error = 'Found no renderable element in that HTML. Everything in it was style, script or metadata.';
    } else {
      msg.tree = walk(root, 'VERTICAL', true);
      if (!msg.tree) msg.error = 'The outer element converted to nothing. It may be empty, or hidden by display none.';
    }
  } catch (e) {
    msg.error = 'Walk failed: ' + e.message;
  }
  parent.postMessage({ htmlizer: msg }, '*');
}
</script>

<script>
// The pasted HTML renders inside an iframe of its own at a desktop width, not in this
// plugin window. Each reason was a real failure first:
//   - Media queries answer to the viewport they render in. This window is 470px wide, so
//     every max-width breakpoint in a desktop page fired and the converter read the phone
//     layout: two-column lists and grids came out as one column.
//   - A page that builds part of itself with script, a detail panel filled in on load,
//     converted with that part empty, since scripts in pasted markup never ran. In the
//     iframe they run as in a browser, in a window of their own, so nothing they declare
//     collides with this plugin or with a previous conversion. Scripts from a URL still
//     fail: the manifest allows no network access.
//   - A full document keeps its real html and body, so body styles apply as written. The
//     old DOMParser route had to copy stylesheets across and rewrite body selectors onto
//     a stand-in div.
//
// Figma sandboxes this plugin window, which gives every document inside it an origin of
// its own, so this window cannot reach into the iframe's DOM. The walker therefore runs
// inside the iframe instead: the script block above is never executed here, its source
// is appended to the page, and once the page has loaded it walks it and posts the tree
// back. It is wrapped in a function so none of its names collide with the page's own.
//
// color-scheme is pinned to light on the iframe, which a page's prefers-color-scheme
// answers to, so a page with a dark mode does not convert dark whenever Figma is dark.
let pending = null;

function mount(html, box, width) {
  return new Promise(function (resolve) {
    box.innerHTML = '';
    const looksLikeDocument = /<!doctype/i.test(html) || /<html[\s>]/i.test(html) || /<body[\s>]/i.test(html);
    // A fragment gets a standards-mode page whose body shrinks to fit its content, as the
    // old hidden div did, but with a desktop width available rather than this window's.
    let page = looksLikeDocument ? html
      : '<!doctype html><html><head><style>html,body{margin:0}body{position:absolute;left:0;top:0}</style></head><body>' + html + '</body></html>';

    // Error capture has to be in place before the page's own scripts run, and anything
    // placed ahead of the doctype would drop the page into quirks mode.
    const catcher = '<script>window.__h2fErrors=[];addEventListener("error",function(e){__h2fErrors.push(e.message)});<\/script>';
    page = page.replace(/^(\s*<!doctype[^>]*>)?/i, function (m) { return m + catcher; });

    const walker = document.getElementById('walker').textContent.replace(/<\/script/gi, '<\\/script');
    page += '<script>(function () {\n' + walker + '\naddEventListener("load", function () { htmlizerRun(' + looksLikeDocument + '); });\n})();<\/script>';

    const frame = document.createElement('iframe');
    frame.style.cssText = 'width:' + width + 'px;height:900px;border:0;color-scheme:light';
    box.appendChild(frame);

    const timer = setTimeout(function () {
      pending = null;
      resolve({ error: 'The pasted HTML never finished loading. A script in it may be stuck in a loop.', warnings: [] });
    }, 8000);
    pending = { source: frame, resolve: function (msg) { clearTimeout(timer); pending = null; resolve(msg); } };
    frame.srcdoc = page;
  });
}

document.getElementById('clear').onclick = function () {
  document.getElementById('src').value = '';
  document.getElementById('log').textContent = '';
};

document.getElementById('go').onclick = async function () {
  const log = document.getElementById('log');
  const html = document.getElementById('src').value.trim();
  if (!html) { log.textContent = 'Nothing to convert.'; return; }

  const width = Math.max(320, parseInt(document.getElementById('vw').value, 10) || 1280);
  log.textContent = 'Rendering...';
  const result = await mount(html, document.getElementById('sandbox'), width);
  if (result.error) { log.textContent = result.error; return; }

  log.textContent = 'Sending to canvas...';
  parent.postMessage({ pluginMessage: { type: 'build', tree: result.tree, warnings: result.warnings } }, '*');
};

onmessage = function (e) {
  if (e.data && e.data.htmlizer) {
    if (pending && e.source === pending.source.contentWindow) pending.resolve(e.data.htmlizer);
    return;
  }
  const m = e.data.pluginMessage;
  if (!m) return;
  const log = document.getElementById('log');
  if (m.type === 'done') {
    let s = 'Built ' + m.frames + ' frames, ' + m.texts + ' text nodes, ' + m.spacers + ' spacers' + (m.svgs ? ', ' + m.svgs + ' svgs' : '') + '.';
    if (m.fontFallbacks && m.fontFallbacks.length) s += '\nFont missing in Figma, fell back to Inter: ' + m.fontFallbacks.join(', ');
    if (m.notes && m.notes.length) s += '\n' + m.notes.map(function (n) { return '! ' + n; }).join('\n');
    if (m.warnings && m.warnings.length) s += '\n' + m.warnings.map(function (w) { return '! ' + w; }).join('\n');
    log.innerHTML = s.replace(/\n/g, '<br>').replace(/! /g, '<span class="warn">! </span>');
  }
  if (m.type === 'error') log.textContent = 'Error: ' + m.message;
};
</script>
